<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>
  <meta name="theme-color" content="#1f2937">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Suivi sportif">

  <title>Suivi sportif</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f6f8;
    }

    body {
      min-height: 100dvh;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #f4f6f8;
    }

    #configError,
    #offlineNotice {
      position: fixed;
      left: 16px;
      right: 16px;
      z-index: 10;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    #configError {
      top: calc(env(safe-area-inset-top) + 16px);
      background: #fff;
      color: #17202a;
    }

    #configError code {
      display: block;
      margin-top: 8px;
      padding: 8px;
      overflow-wrap: anywhere;
      border-radius: 8px;
      background: #f1f3f5;
    }

    #offlineNotice {
      bottom: calc(env(safe-area-inset-bottom) + 16px);
      display: none;
      background: #17202a;
      color: #fff;
      text-align: center;
    }

    body.offline #offlineNotice {
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="Suivi sportif"
    allow="fullscreen; clipboard-read; clipboard-write"
  ></iframe>

  <div id="configError" hidden>
    <strong>Configuration nécessaire</strong>
    <div>
      Dans ce fichier <code>index.html</code>, remplace la valeur de
      <code>GOOGLE_APPS_SCRIPT_URL</code> par l'URL de déploiement de ta Web App,
      celle qui se termine par <strong>/exec</strong>.
    </div>
  </div>

  <div id="offlineNotice">
    Connexion Internet indisponible. L'application Apps Script nécessite une connexion.
  </div>

  <script>
    /* =========================================================
       CONFIGURATION
       =========================================================

       Colle ici l'URL de ton déploiement Google Apps Script.
       Exemple :
       https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxxxx/exec
    */
    const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUbGq17nPkVdP8y4-9g1z2mW3fuGnKqeJPeEDm6oBBqhaQJF10eu-Xw-QpAOUo44TBVQ/exec';


    /* =========================================================
       CHARGEMENT DE L'APPLICATION APPS SCRIPT
       ========================================================= */

    const appFrame = document.getElementById('appFrame');
    const configError = document.getElementById('configError');

    function isConfiguredUrl(value) {
      return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/.test(value);
    }

    if (isConfiguredUrl(GOOGLE_APPS_SCRIPT_URL)) {
      appFrame.src = GOOGLE_APPS_SCRIPT_URL;
    } else {
      configError.hidden = false;
    }


    /* =========================================================
       ÉTAT RÉSEAU
       ========================================================= */

    function updateOnlineState() {
      document.body.classList.toggle('offline', !navigator.onLine);
    }

    window.addEventListener('online', updateOnlineState);
    window.addEventListener('offline', updateOnlineState);
    updateOnlineState();


    /* =========================================================
       SERVICE WORKER DU CONTENEUR PWA
       =========================================================

       Il met en cache le conteneur PWA (cet index, le manifest et les icônes).
       L'application Google Apps Script affichée dans l'iframe reste en ligne.
    */

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js')
          .catch(error => console.error('Service worker non enregistré :', error));
      });
    }
  </script>
</body>
</html>
